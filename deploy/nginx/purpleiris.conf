# nginx config for ingest.purpleiris.live and daemon-admin.purpleiris.live
# Set up at Phase 5. TLS via Let's Encrypt / certbot.
# Reference: legacy/docker/nginx-purpleiris.conf for the old purpleiris.live config.

server {
    listen 80;
    server_name ingest.purpleiris.live;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name ingest.purpleiris.live;

    ssl_certificate     /etc/letsencrypt/live/ingest.purpleiris.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ingest.purpleiris.live/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
    }
}

# daemon-admin is IP-restricted to admin only
server {
    listen 80;
    server_name daemon-admin.purpleiris.live;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name daemon-admin.purpleiris.live;

    ssl_certificate     /etc/letsencrypt/live/daemon-admin.purpleiris.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daemon-admin.purpleiris.live/privkey.pem;

    # Replace with actual admin IP before enabling
    allow ADMIN_IP_PLACEHOLDER;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
    }
}
