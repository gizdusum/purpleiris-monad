# nginx config for ingest.purpleiris.live only
# Phase 5: daemon-admin block is intentionally omitted (Phase 10)

server {
    listen 80;
    server_name ingest.purpleiris.live;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name ingest.purpleiris.live;

    ssl_certificate     /etc/letsencrypt/live/ingest.purpleiris.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ingest.purpleiris.live/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /health {
        proxy_pass http://127.0.0.1:3010/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        client_max_body_size 64k;
    }
}
